[package]
name = "wakelock"
version = "0.1.0"
edition = "2024"
description = "Lock screen for wlroots compositors (ext-session-lock-v1) with a blurred snapshot of the desktop"
license = "MIT"

[dependencies]
async-channel = "=2.5.0"
glib-unix = "=0.22.8"
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_16"] }
gtk4-session-lock = { version = "=0.4.1", features = ["v1_2"] }
libc = "=0.2.191"

[profile.release]
lto = "thin"
strip = true
